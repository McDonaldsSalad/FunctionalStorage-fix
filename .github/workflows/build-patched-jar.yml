name: Build patched Functional Storage JAR

on:
  push:
    branches:
      - '1.21'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Functional Storage
        run: bash ./gradlew build --no-daemon

      - name: Collect release JAR
        shell: bash
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp '{}' dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Upload patched JAR
        uses: actions/upload-artifact@v4
        with:
          name: functionalstorage-1.21.1-1.5.8-compacting-fix
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
